<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121516"><title>YupLand Heroes — первый рейд</title><link rel="stylesheet" href="../src/raid.css"><script type="module" src="../src/raid-ui.js"></script><script src="site-adapter.js"></script><style>html[data-motion="reduced"] *,html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{animation:none!important;transition:none!important}</style></head>
<body><main id="app" class="game-surface"><div id="frame" class="scene-frame">
 <img id="scene-bg" class="scene-bg" src="../assets/battle-landscape.webp" alt="">
 <header id="hud" class="hud"><div class="quest"><span class="brand">YUPLAND HEROES</span><strong id="task-title">Нажми на сундук</strong><div class="steps" aria-hidden="true"><span class="step current" data-t="fightStep">БОЙ</span><i></i><span class="step" data-t="find">НАХОДКА</span><i></i><span class="step" data-t="sellStep">ПРОДАЖА</span><i></i><span class="step" data-t="powerStep">УСИЛЕНИЕ</span><i></i><span class="step" data-t="revengeStep">РЕВАНШ</span></div></div><span id="step-count" aria-hidden="true">01 / 05</span><div class="hud-right"><span class="balance" id="resource-balance"><img src="../assets/rainbow-logs.webp" alt=""><b id="resource-count">0</b></span><span class="balance gold" id="gold-balance"><img src="../assets/gold.webp" alt=""><b id="gold-count">0</b></span><button id="language" class="hud-button" type="button" aria-label="Switch to English">EN</button><button id="restart" class="hud-button restart" type="button" aria-label="Начать заново">↻</button><button id="exit" class="hud-button" type="button" aria-label="Закрыть" hidden>×</button></div></header>
 <div id="stage" class="stage" tabindex="0" role="group" aria-label="Карта рейда"><div id="world" class="world"><div class="ground" aria-hidden="true"></div><div class="camp-road" aria-hidden="true"></div><svg id="hex-floor" class="hex-floor" viewBox="0 0 1600 1000" aria-hidden="true"></svg><svg id="route" class="route" viewBox="0 0 1600 1000" aria-hidden="true"></svg><div id="actors"></div><div id="hero" class="hero" aria-hidden="true"><img class="hero-aura" src="../assets/ring-gold.png" alt=""><span class="combat-health hero-health" role="progressbar" aria-label="Hero" aria-valuemin="0" aria-valuemax="100"><i id="hero-health-fill"></i></span><span class="hero-shadow"></span><span id="hero-sprite" class="hero-sprite"></span><img id="hero-idle" class="hero-pose hero-idle" src="../assets/knight-idle-art.png" alt=""><img id="hero-attack" class="hero-pose hero-attack" src="../assets/knight-attack-art.png" alt=""><span id="hero-cargo" class="hero-cargo" hidden></span><span id="cargo-count" class="cargo-count" hidden></span><img id="hero-artifact" class="hero-artifact" alt="" hidden><span id="power-badge" class="power-badge" hidden></span></div><div id="effects" aria-hidden="true"></div></div></div>
 <button id="shop-prompt" class="shop-prompt" type="button" hidden><img id="shop-item" alt=""><span class="shop-copy"><strong id="shop-name">Камни</strong><span id="shop-stat"></span><span class="shop-buy-label" data-t="buyShort">Купить и надеть</span></span><span class="shop-cost"><img src="../assets/gold.webp" alt=""><b id="shop-price">100</b></span></button>
 <footer class="hint-bar"><p id="hint" role="status" aria-live="polite"></p><span class="hint-dot" aria-hidden="true"></span></footer>
 <section id="completion" class="completion" tabindex="-1" hidden aria-labelledby="completion-title"><div class="completion-top"><span class="completion-check" aria-hidden="true">✓</span><div><p class="eyebrow" data-t="finish">Первый рейд пройден</p><h2 id="completion-title" data-t="done">Герой усилен</h2></div><strong id="completion-stat"></strong></div><a id="open-game" class="primary" href="https://t.me/yuplink_bot" target="_blank" rel="noopener noreferrer" data-t="openGame">Продолжить в полной игре ↗</a><button id="replay" class="text-button" type="button" data-t="replay">Пройти ещё раз</button></section>
 <section id="cover" class="cover" aria-labelledby="cover-title"><div class="cover-card"><p class="eyebrow">YUPLAND HEROES</p><h1 id="cover-title">Открываем мир…</h1><p id="cover-copy"></p><progress id="progress" value="0" max="100" aria-label="Загрузка"></progress><button id="cover-action" class="primary" type="button" hidden></button><button id="cover-secondary" class="text-button" type="button" hidden></button></div></section>
 <section id="restart-shade" class="object-shade" hidden role="dialog" aria-modal="true" aria-labelledby="restart-title"><div class="object-card"><h2 id="restart-title" data-t="restartTitle">Начать заново?</h2><p data-t="restartCopy">Ты вернёшься к началу этого приключения.</p><div class="dialog-actions"><button id="keep-playing" class="secondary" type="button" data-t="keep">Продолжить</button><button id="confirm-restart" class="primary" type="button" data-t="restart">Заново</button></div></div></section>
 <noscript><p class="no-js">Включи JavaScript для игры. / Enable JavaScript to play.</p></noscript>
</div></main></body></html>
